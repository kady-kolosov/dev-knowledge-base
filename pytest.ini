[pytest]

pythonpath = .

# Путь к папке с тестами
testpaths = tests

# Аргументы запуска
addopts =
    -v
    --tb=short
    --strict-markers
    --headed
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure

# Маркеры
markers =
    smoke: Критические тесты для проверки основной функциональности
    regression: Полный регрессионный набор
    need_review: Тесты на ревью или для отладки

# Логирование
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
